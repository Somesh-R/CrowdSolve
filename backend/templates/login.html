<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CrowdSolve</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        /*
         * Login-page role selection.
         * The existing registration page already uses role cards;
         * these styles make the login selection visually consistent.
         */

        .login-role-selection {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .login-role-option {
            position: relative;
            display: block;
            cursor: pointer;
        }

        .login-role-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .login-role-content {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 82px;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid #263752;
            border-radius: 14px;
            background: #080f1d;
            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .login-role-content:hover {
            border-color: #2d8cff;
            transform: translateY(-1px);
        }

        .login-role-option input:checked + .login-role-content {
            border-color: #2d8cff;
            background: rgba(30, 136, 229, 0.10);
            box-shadow: 0 0 0 1px rgba(45, 140, 255, 0.18);
        }

        .login-role-icon {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0b2344;
            color: #2d8cff;
            font-weight: 800;
            font-size: 1rem;
        }

        .login-role-text {
            min-width: 0;
        }

        .login-role-text strong {
            display: block;
            margin-bottom: 5px;
            color: #f5f7fb;
            font-size: 1rem;
        }

        .login-role-text span {
            display: block;
            color: #8fa7c5;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        @media (max-width: 600px) {
            .login-role-selection {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body class="auth-body">


    <!-- =====================================================
         AUTH NAVIGATION
    ====================================================== -->

    <nav class="auth-navbar">

        <a href="/" class="logo">
            Crowd<span>Solve</span>
        </a>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </nav>


    <!-- =====================================================
         LOGIN SECTION
    ====================================================== -->

    <main class="auth-container">

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <span class="section-tag">
                    WELCOME BACK
                </span>

                <h1>
                    Login to CrowdSolve
                </h1>

                <p>
                    Select your role, then enter your account
                    credentials to access the correct dashboard.
                </p>

            </div>


            <!-- ERROR / SUCCESS MESSAGE -->

            <div
                id="messageBox"
                class="message-box hidden"
            ></div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                class="auth-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     ROLE SELECTION
                ================================================== -->

                <div class="form-group">

                    <label>
                        Choose Your Role
                    </label>

                    <div class="login-role-selection">


                        <!-- PROBLEMER -->

                        <label
                            class="login-role-option"
                            for="loginProblemer"
                        >

                            <input
                                type="radio"
                                id="loginProblemer"
                                name="role"
                                value="problemer"
                                required
                            >

                            <div class="login-role-content">

                                <div class="login-role-icon">
                                    P
                                </div>

                                <div class="login-role-text">

                                    <strong>
                                        Problemer
                                    </strong>

                                    <span>
                                        Post problems and receive
                                        multiple solutions.
                                    </span>

                                </div>

                            </div>

                        </label>


                        <!-- SOLVER -->

                        <label
                            class="login-role-option"
                            for="loginSolver"
                        >

                            <input
                                type="radio"
                                id="loginSolver"
                                name="role"
                                value="solver"
                                required
                            >

                            <div class="login-role-content">

                                <div class="login-role-icon">
                                    S
                                </div>

                                <div class="login-role-text">

                                    <strong>
                                        Solver
                                    </strong>

                                    <span>
                                        Browse problems and submit
                                        your solutions.
                                    </span>

                                </div>

                            </div>

                        </label>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <a
                    href="{{ url_for('register_page') }}"
                >
                    Create an Account
                </a>

            </div>


            <!-- PLATFORM INFO -->

            <div class="auth-info">

                <strong>
                    CrowdSolve Platform
                </strong>

                <span>
                    AI-powered crowdsourced problem solving
                    using TF-IDF and Logistic Regression.
                </span>

            </div>

        </div>

    </main>


    <!-- =====================================================
         MAIN JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>


    <!-- =====================================================
         LOGIN LOGIC
    ====================================================== -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const messageBox =
            document.getElementById("messageBox");

        const loginButton =
            document.getElementById("loginButton");

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        // ====================================================
        // SHOW / HIDE PASSWORD
        // ====================================================

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    togglePassword.textContent =
                        "Hide";

                }

                else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "Show";

                }

            }
        );


        // ====================================================
        // DISPLAY MESSAGE
        // ====================================================

        function showMessage(
            message,
            type
        ) {

            messageBox.textContent =
                message;

            messageBox.className =
                "message-box " + type;

        }


        // ====================================================
        // LOGIN FORM SUBMISSION
        // ====================================================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const selectedRole =
                    document.querySelector(
                        'input[name="role"]:checked'
                    );


                // =============================================
                // VALIDATE ROLE
                // =============================================

                if (!selectedRole) {

                    showMessage(
                        "Please select whether you are a Problemer or Solver.",
                        "error"
                    );

                    return;

                }


                const role =
                    selectedRole.value;


                // =============================================
                // DISABLE BUTTON
                // =============================================

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    // =========================================
                    // CALL BACKEND API
                    // =========================================

                    const response =
                        await fetch(
                            "/api/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password,

                                    role: role

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        response.ok &&
                        data.success
                    ) {

                        const user =
                            data.user || data;


                        /*
                         * The current backend authenticates the
                         * credentials and returns the stored role.
                         *
                         * Verify the selected role before allowing
                         * the user into a dashboard.
                         */

                        const actualRole =
                            String(
                                user.role || ""
                            )
                            .trim()
                            .toLowerCase();


                        if (
                            actualRole !== role
                        ) {

                            showMessage(
                                "The selected role does not match this account. Please choose the correct role.",
                                "error"
                            );

                            loginButton.disabled =
                                false;

                            loginButton.textContent =
                                "Login";

                            return;

                        }


                        showMessage(
                            "Login successful. Redirecting...",
                            "success"
                        );


                        // =========================================
                        // STORE USER INFORMATION
                        // =========================================

                        localStorage.setItem(

                            "crowdsolve_user",

                            JSON.stringify(
                                user
                            )

                        );


                        // =========================================
                        // REDIRECT BASED ON SELECTED ROLE
                        // =========================================

                        setTimeout(
                            function () {

                                if (
                                    role ===
                                    "problemer"
                                ) {

                                    window.location.href =
                                        "/problemer-dashboard";

                                }

                                else if (
                                    role ===
                                    "solver"
                                ) {

                                    window.location.href =
                                        "/solver-dashboard";

                                }

                            },

                            700

                        );

                    }

                    else {

                        showMessage(

                            data.message ||
                            "Login failed. Please check your credentials.",

                            "error"

                        );


                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                    }

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(

                        "Unable to connect to the server. Please make sure the backend is running.",

                        "error"

                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>
</html>
